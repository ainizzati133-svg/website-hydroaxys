<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Hydroaxys</title>
    <style>
        /* Gaya Asas & Font */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* Kotak Borang Utama */
        .form-container {
            background-color: #ffffff;
            max-width: 650px;
            width: 100%;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            animation: fadeIn 0.6s ease-out; /* Animasi masuk */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Tajuk & Teks */
        h1 {
            color: #0f3d6e; /* Warna biru gelap seakan gambar */
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
            margin-top: 0;
        }

        p.subtitle {
            color: #154c8a;
            font-size: 15px;
            margin-bottom: 30px;
        }

        /* Susunan Grid untuk Nama */
        .name-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* Gaya Kumpulan Input */
        .input-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: #0f3d6e;
            margin-bottom: 8px;
        }

        /* Gaya Kotak Input & Textarea */
        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
            font-family: inherit;
            box-sizing: border-box;
            transition: all 0.3s ease; /* Animasi UX */
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        /* Animasi semasa pengguna klik kotak input (Focus) */
        input:focus, textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        input::placeholder, textarea::placeholder {
            color: #9ca3af;
        }

        /* Butang Hantar */
        button {
            background-color: #0f3d6e;
            color: white;
            font-weight: 600;
            font-size: 16px;
            padding: 14px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease, transform 0.1s ease;
            margin-top: 10px;
        }

        /* Animasi Butang */
        button:hover {
            background-color: #1e5b9f;
        }
        button:active {
            transform: scale(0.98);
        }

        /* Responsif untuk skrin kecil (Telefon) */
        @media (max-width: 500px) {
            .name-grid {
                grid-template-columns: 1fr;
                gap: 0;
            }
            .form-container {
                padding: 25px;
            }
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h1>Contact Hydroaxys</h1>
        <p class="subtitle">Please provide your details and inquiry information below.</p>

        <form action="https://api.web3forms.com/submit" method="POST">
            <!-- GANTI ACCESS KEY DI SINI -->
            <input type="hidden" name="access_key" value="7ed67e77-97ac-4d74-af5f-3468623e79e5">
            
            <!-- Honeypot untuk elak spam bot -->
            <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

            <div class="name-grid">
                <div class="input-group">
                    <label>First Name *</label>
                    <input type="text" name="First Name" required>
                </div>
                <div class="input-group">
                    <label>Last Name *</label>
                    <input type="text" name="Last Name" required>
                </div>
            </div>

            <div class="input-group">
                <label>Email Address *</label>
                <input type="email" name="Email" placeholder="email@company.com" required>
            </div>

            <div class="input-group">
                <label>Company Name *</label>
                <input type="text" name="Company Name" required>
            </div>

            <div class="input-group">
                <label>Subject *</label>
                <input type="text" name="Subject" placeholder="How can we help you?" required>
            </div>

            <div class="input-group">
                <label>Message *</label>
                <textarea name="Message" placeholder="Please describe your project or inquiry in detail..." required></textarea>
            </div>

            <button type="submit">Submit Inquiry</button>
        </form>
    </div>

</body>
</html>
